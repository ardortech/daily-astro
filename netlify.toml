[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify Functions + Scheduled Functions (daily-sky; Phases 3–5 add readings, push, author tracker).
# The schedule lives in each function's `export const config`.
# These are v2 functions (default export returning a Response): Netlify always packages them
# with nft, keeping node_modules external, so `node_bundler` would have no effect.
[functions]
  directory = "netlify/functions"
  # src/astro loads astronomy-engine's CommonJS build in Node (src/astro/engine.node.cjs).
  # nft can't see that require after transpiling, so ship the package explicitly.
  included_files = ["node_modules/astronomy-engine/package.json", "node_modules/astronomy-engine/astronomy.js", "node_modules/lunar-javascript/**"]

# The service worker must never be cached by the browser/CDN, or updates stall.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

# App icons: explicit type, and revalidated so a new icon reaches phones on the next visit.
# Netlify serves these files directly (there is no SPA fallback redirect in this site);
# test/pwa.test.js fails if a catch-all redirect is ever added that could shadow them.
[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/apple-touch-icon-precomposed.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icon-*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
